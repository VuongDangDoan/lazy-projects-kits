# .github/workflows/deploy.yml — deploys to Vercel ({{PROD_BRANCH}} → prod, {{STAGING_BRANCH}} → preview)
name: Deploy — Vercel

on:
  push:
    branches: [{{PROD_BRANCH}}, {{STAGING_BRANCH}}]

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: npm
      - run: {{INSTALL_CMD}}
      - run: {{SETUP_CMD}}
      - run: {{CHECK_CMD}}
      - run: {{LINT_CMD}}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [check]   # quality gate — opt-out by deletion only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/{{PROD_BRANCH}}" ]; then
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          else
            vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          fi
