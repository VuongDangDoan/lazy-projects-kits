# .github/workflows/deploy-staging.yml — deploys to Railway staging on push to {{STAGING_BRANCH}}
# Only install this file if a staging environment was chosen.
name: Deploy — Staging

on:
  push:
    branches: [{{STAGING_BRANCH}}]

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: npm
      - run: {{INSTALL_CMD}}
      - run: {{SETUP_CMD}}
      - run: {{CHECK_CMD}}
      - run: {{LINT_CMD}}

  deploy:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    needs: [check]   # quality gate — opt-out by deletion only
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }} --detach
